<input class="q" id="q" type="search" placeholder="Search by name or country" aria-label="Search players"><div class="pl" id="pl"><p class="note">Loading&hellip;</p></div></main>
<script>
(function(){
  var data=null,tour='atp',q=document.getElementById('q'),box=document.getElementById('pl');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var p=new URLSearchParams(location.search), want=(p.get('q')||'').trim(); if(want) q.value=want;
  function draw(){ if(!data) return; var list=data[tour]||[], t=q.value.trim().toLowerCase(), f=t?list.filter(function(x){return (x.name+' '+x.country+' '+x.countryName).toLowerCase().indexOf(t)>=0;}):list;
    box.innerHTML=f.length?f.map(function(x){ var k='p:'+x.name; return '<div class="pc'+(want&&x.name===want?' hl':'')+'"><span class="r">'+x.rank+'</span><span class="nm">'+esc(x.name)+'<small>'+esc(x.countryName||x.country)+(x.age?' \u00B7 age '+x.age:'')+'</small></span><span class="pt">'+Number(x.points).toLocaleString('en-US')+'</span>'+(window.TB?TB.star({k:k,t:'player',n:x.name,u:'/players?q='+encodeURIComponent(x.name)}):'')+'</div>'; }).join(''):'<p class="note">No players match.</p>'; if(window.TB) TB.paint(); }
  function pick(t){ tour=t; document.getElementById('tA').setAttribute('aria-selected',t==='atp'); document.getElementById('tW').setAttribute('aria-selected',t==='wta'); draw(); }
  document.getElementById('tA').onclick=function(){pick('atp');}; document.getElementById('tW').onclick=function(){pick('wta');}; q.addEventListener('input',function(){ want=''; draw(); });
  fetch('/api/rankings').then(function(r){return r.json();}).then(function(d){ data=d; if(want&&!(d.atp||[]).some(function(x){return x.name===want;})&&(d.wta||[]).some(function(x){return x.name===want;})) tour='wta'; pick(tour); }).catch(function(){ box.innerHTML='<p class="note">Players are temporarily unavailable.</p>'; });
})();
